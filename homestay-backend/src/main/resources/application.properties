spring.application.name=homestay-backend

spring.datasource.url=jdbc:mysql://localhost:3306/homestay_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.error.include-message=always
file.upload-dir=./uploads

# UC-06 / BR-9: SYSTEM scheduler — auto-cancel PENDING quá hạn + auto refund
spring.task.scheduling.pool.size=1
homestay.scheduler.enabled=true
homestay.scheduler.cron=0 */5 * * * *
homestay.scheduler.payment-deadline-hours=24
homestay.scheduler.host-approval-deadline-hours=48
